name.Spanish=El silencio de Crowmoor
name.French=Le silence de Crowmoor
synopsys.Spanish=Una llamada de auxilio, un pueblo vacío y un oscuro secreto que no debe ser liberado.
synopsys.French=Un appel au secours, un village vide et un sombre secret qui ne doit pas être libéré.
description.Spanish=Los investigadores son llamados al remoto pueblo de <b><color=blue>Crowmoor</color></b> tras una inquietante llamada de auxilio del padre <b><color=magenta>Elias Merrin</color></b>. \nEl escenario comienza en la calle frente a la rectoría, donde deberán encontrar una forma de entrar para descubrir qué ocurrió en el interior.\n A medida que avancen, explorarán oscuros pasillos, se enfrentarán a horrores que se ocultan en las sombras y deberán desentrañar el misterio de un antiguo sello que amenaza con romperse. \nEl escenario combina <color=yellow>exploración, puzles y combate</color> poniendo a prueba tanto la fuerza como el ingenio de los jugadores. \n\nPreparaos para enfrentar lo desconocido y descubrir secretos que podrían haber sido mejor dejados en las profundidades.\n\n<i>Segunda versión de la aventura, modificada teniendo en cuenta las opiniones y aportaciones de muchos de los jugadores a través de sus reseñas. Gracias a todos por ayudarme a mejorar la aventura.</i>
description.French=Les investigateurs sont appelés dans le village reculé de <b><color=blue>Crowmoor</color></b> après un appel au secours inquiétant du père <b><color=magenta>Elias Merrin</color></b>. \nLe scénario commence dans la rue face au presbytère, où ils devront trouver un moyen d'entrer pour découvrir ce qui s'est passé à l'intérieur.\n Au fur et à mesure de leur progression, ils exploreront de sombres couloirs, affronteront des horreurs cachées dans les ombres et devront percer le mystère d'un sceau ancien qui menace de se briser. \nLe scénario combine <color=yellow>exploration, énigmes et combat</color> mettant à l'épreuve aussi bien la force que l'ingéniosité des joueurs. \n\nPréparez-vous à affronter l'inconnu et à découvrir des secrets qui auraient mieux fait de rester dans les profondeurs.\n\n\n<i>Seconde version de l'aventure, modifiée en tenant compte des avis et contributions de nombreux joueurs à travers leurs critiques. Merci à tous de m'aider à améliorer l'aventure.</i>
